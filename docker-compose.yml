services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/estoque.db
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-admin123}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      # Painel de backups: regras, apelidos e tokens em data/backup_monitor.json;
      # as variáveis abaixo (opcionais, via .env) sobrepõem os tokens do arquivo.
      BACKUP_INGEST_TOKEN: ${BACKUP_INGEST_TOKEN:-}
      BACKUP_ADMIN_TOKEN: ${BACKUP_ADMIN_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./backups:/backups

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

  tests:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: sqlite:////tmp/estoque_test.db
    command: ["pytest", "-q"]
