worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Otimizações de compressão para arquivos estáticos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name localhost;

        # Roteia chamadas de API para o backend FastAPI
        location /api/ {
            proxy_pass http://api:8000/; # A barra final retira o /api da requisição original
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Serve os arquivos estáticos do frontend (React/Vite)
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            # Importante para SPAs (Single Page Applications): sempre retornar index.html
            try_files $uri $uri/ /index.html;
        }
    }
}
